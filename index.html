<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escape Room</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/room.css">

    <link rel="stylesheet" href="css/ui.css">

    <link rel="stylesheet" href="css/animations.css">

    <link rel="stylesheet" href="css/inventory.css">

    <link rel="stylesheet" href="css/leaderboard.css">

</head>

<body>

<!-- ==========================
     LOADING SCREEN
========================== -->

<section id="loadingScreen">

    <img
        src="assets/images/ui/logo.jpeg"
        alt="Escape Room Logo"
        id="gameLogo">

    <h1>
        ESCAPE ROOM
    </h1>

    <p>
        Loading...
    </p>

</section>

<!-- ==========================
     MAIN MENU
========================== -->

<section id="mainMenu" class="hidden">

    <h1 class="gameTitle">

        ESCAPE ROOM

    </h1>

    <div class="menuButtons">

        <button id="startBtn">

            ▶ Start Game

        </button>

        <button id="continueBtn">

            ⏯ Continue

        </button>

        <button id="leaderboardBtn">

            🏆 Leaderboard

        </button>

        <button id="settingsBtn">

            ⚙ Settings

        </button>

    </div>

</section>

<!-- ==========================
     GAME HUD
========================== -->

<div id="hud" class="hidden">

    <div class="hudBox glass">

        ⏳

        <span id="timer">

            15:00

        </span>

    </div>

    <div class="hudBox glass">

        💡

        <span id="hints">

            3

        </span>

    </div>

    <div class="hudBox glass">

        ⭐

        <span id="score">

            0

        </span>

    </div>

</div>

<!-- ==========================
     GAME ROOM
========================== -->

<section id="room" class="hidden">

    <img
        id="roomImage"
        src="assets/images/rooms/Lab.jpeg"
        alt="Escape Room">

    <div id="objects">

        <div
            class="object key"
            id="objKey">
        </div>

        <div
            class="object note"
            id="objNote">
        </div>

        <div
            class="object keypad"
            id="objKeypad">
        </div>

        <div
            class="object door"
            id="objDoor">
        </div>

    </div>

</section>
<!-- ==========================
     INVENTORY
========================== -->

<aside id="inventory" class="hidden glass">

    <h2 class="inventoryTitle">

        🎒 Inventory

    </h2>

    <div id="inventoryItems">

        <!-- Inventory items generated by JavaScript -->

    </div>

</aside>

<!-- ==========================
     PUZZLE MODAL
========================== -->

<section id="puzzleModal" class="hidden">

    <div class="modalContent glass">

        <h2 id="puzzleTitle">

            Puzzle

        </h2>

        <div id="puzzleBody">

            <!-- Puzzle will appear here -->

        </div>

        <div class="modalButtons">

            <button id="submitPuzzle">

                ✅ Submit

            </button>

            <button id="closePuzzle">

                ❌ Close

            </button>

        </div>

    </div>

</section>

<!-- ==========================
     LEADERBOARD
========================== -->

<section id="leaderboardScreen" class="hidden">

    <div class="leaderboard glass">

        <div class="leaderboardHeader">

            <h1>

                🏆 Leaderboard

            </h1>

        </div>

        <table class="leaderboardTable">

            <thead>

                <tr>

                    <th>Rank</th>

                    <th>Player</th>

                    <th>Score</th>

                    <th>Time</th>

                </tr>

            </thead>

            <tbody id="leaderboardBody">

                <!-- Filled by leaderboard.js -->

            </tbody>

        </table>

        <div class="leaderboardFooter">

            <button id="closeLeaderboard">

                Close

            </button>

        </div>

    </div>

</section>

<!-- ==========================
     SETTINGS
========================== -->

<section id="settingsPanel" class="hidden">

    <div class="modalContent glass">

        <h2>

            ⚙ Settings

        </h2>

        <div class="settingsRow">

            <span>

                🎵 Music

            </span>

            <input
                type="checkbox"
                id="musicToggle"
                checked>

        </div>

        <div class="settingsRow">

            <span>

                🔊 Sound Effects

            </span>

            <input
                type="checkbox"
                id="soundToggle"
                checked>

        </div>

        <div class="settingsRow">

            <span>

                🌙 Dark Theme

            </span>

            <input
                type="checkbox"
                id="themeToggle"
                checked>

        </div>

        <button id="closeSettings">

            Save & Close

        </button>

    </div>

</section>
<!-- =========================================
     WIN SCREEN
========================================= -->

<section id="winScreen" class="hidden">

    <div class="modalContent glass">

        <img
            src="assets/images/ui/logo.jpeg"
            alt="Winner Logo"
            class="winLogo">

        <h1>

            🎉 YOU ESCAPED!

        </h1>

        <p id="finalScore">

            Score : 0

        </p>

        <button id="playAgain">

            🔄 Play Again

        </button>

    </div>

</section>

<!-- =========================================
     GAME OVER
========================================= -->

<section id="gameOver" class="hidden">

    <div class="modalContent glass">

        <h1>

            💀 TIME'S UP!

        </h1>

        <p>

            Better luck next time.

        </p>

        <button id="restart">

            🔄 Restart

        </button>

    </div>

</section>

<!-- =========================================
     AUDIO
========================================= -->

<audio id="bgMusic" loop>

    <source
        src="assets/audio/bgm/theme.mp3"
        type="audio/mpeg">

</audio>

<audio id="clickSound">

    <source
        src="assets/audio/sfx/click.mp3"
        type="audio/mpeg">

</audio>

<audio id="pickupSound">

    <source
        src="assets/audio/sfx/pickup.mp3"
        type="audio/mpeg">

</audio>

<audio id="unlockSound">

    <source
        src="assets/audio/sfx/unlock.mp3"
        type="audio/mpeg">

</audio>

<audio id="successSound">

    <source
        src="assets/audio/sfx/success.mp3"
        type="audio/mpeg">

</audio>

<audio id="wrongSound">

    <source
        src="assets/audio/sfx/wrong.mp3"
        type="audio/mpeg">

</audio>

<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="js/utils.js"></script>

<script src="js/gameState.js"></script>

<script src="js/settings.js"></script>

<script src="js/player.js"></script>

<script src="js/audio.js"></script>

<script src="js/inventory.js"></script>

<script src="js/roomGenerator.js"></script>

<script src="js/puzzleManager.js"></script>

<script src="js/timer.js"></script>

<script src="js/saveManager.js"></script>

<script src="js/leaderboard.js"></script>

<script src="js/achievements.js"></script>

<script src="js/game.js"></script>

<script src="js/app.js"></script>

</body>

</html>
