<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escape Room</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/room.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/leaderboard.css">

</head>

<body>

<!-- ==========================
     LOADING SCREEN
========================== -->

<div id="loadingScreen">

    <h1>ESCAPE ROOM</h1>

    <p>Loading...</p>

</div>

<!-- ==========================
     MAIN MENU
========================== -->

<section id="mainMenu" class="hidden">

    <h1 class="gameTitle">
        ESCAPE ROOM
    </h1>

    <div class="menuButtons">

        <button id="startBtn">
            ▶ Start Game
        </button>

        <button id="continueBtn">
            ⏯ Continue
        </button>

        <button id="leaderboardBtn">
            🏆 Leaderboard
        </button>

        <button id="settingsBtn">
            ⚙ Settings
        </button>

    </div>

</section>

<!-- ==========================
     HUD
========================== -->

<header id="hud" class="hidden">

    <div class="hudBox glass">

        ⏳

        <span id="timer">
            15:00
        </span>

    </div>

    <div class="hudBox glass">

        💡

        <span id="hints">
            3
        </span>

    </div>

    <div class="hudBox glass">

        ⭐

        <span id="score">
            0
        </span>

    </div>

</header>

<!-- ==========================
     GAME ROOM
========================== -->

<main id="room" class="hidden">

    <img
        id="roomImage"
        src="assets/images/rooms/lab.jpg"
        alt="Escape Room">

    <!-- Objects -->

    <div id="objects">

        <div
            class="object key"
            id="objKey"
            title="Key">
        </div>

        <div
            class="object note"
            id="objNote"
            title="Note">
        </div>

        <div
            class="object keypad"
            id="objKeypad"
            title="Keypad">
        </div>

        <div
            class="object door"
            id="objDoor"
            title="Exit Door">
        </div>

    </div>

</main>
<!-- ==========================
     INVENTORY
========================== -->

<aside id="inventory" class="hidden">

    <h2 class="inventoryTitle">
        🎒 Inventory
    </h2>

    <div id="inventoryItems">

        <!-- Items generated by JavaScript -->

    </div>

</aside>

<!-- ==========================
     PUZZLE MODAL
========================== -->

<section id="puzzleModal" class="hidden">

    <div class="modalContent glass">

        <h2 id="puzzleTitle">
            Puzzle
        </h2>

        <div id="puzzleBody">

            <!-- Puzzle generated here -->

        </div>

        <div class="modalButtons">

            <button id="submitPuzzle">
                ✅ Submit
            </button>

            <button id="closePuzzle">
                ❌ Close
            </button>

        </div>

    </div>

</section>

<!-- ==========================
     LEADERBOARD
========================== -->

<section id="leaderboardScreen" class="hidden">

    <div class="leaderboard">

        <div class="leaderboardHeader">

            <h1>
                🏆 Leaderboard
            </h1>

        </div>

        <table class="leaderboardTable">

            <thead>

                <tr>

                    <th>Rank</th>

                    <th>Player</th>

                    <th>Score</th>

                    <th>Time</th>

                </tr>

            </thead>

            <tbody id="leaderboardBody">

            </tbody>

        </table>

        <div class="leaderboardFooter">

            <button id="closeLeaderboard">
                Close
            </button>

        </div>

    </div>

</section>

<!-- ==========================
     SETTINGS
========================== -->

<section id="settingsPanel" class="hidden">

    <div class="modalContent glass">

        <h2>
            ⚙ Settings
        </h2>

        <div class="settingsRow">

            <span>
                🎵 Music
            </span>

            <input
                type="checkbox"
                id="musicToggle"
                checked>

        </div>

        <div class="settingsRow">

            <span>
                🔊 Sound
            </span>

            <input
                type="checkbox"
                id="soundToggle"
                checked>

        </div>

        <div class="settingsRow">

            <span>
                🌙 Dark Theme
            </span>

            <input
                type="checkbox"
                id="themeToggle"
                checked>

        </div>

        <button id="closeSettings">
            Save & Close
        </button>

    </div>

</section>
<!-- ==========================
     WIN SCREEN
========================== -->

<section id="winScreen" class="hidden">

    <div class="modalContent glass">

        <h1>🎉 You Escaped!</h1>

        <p id="finalScore">
            Final Score : 0
        </p>

        <button id="playAgain">
            🔄 Play Again
        </button>

    </div>

</section>

<!-- ==========================
     GAME OVER SCREEN
========================== -->

<section id="gameOver" class="hidden">

    <div class="modalContent glass">

        <h1>💀 Time's Up!</h1>

        <p>You couldn't escape in time.</p>

        <button id="restart">
            🔄 Restart
        </button>

    </div>

</section>

<!-- ==========================
     AUDIO
========================== -->

<audio id="bgMusic" loop>
    <source src="assets/audio/bgm/theme.mp3" type="audio/mpeg">
</audio>

<audio id="clickSound">
    <source src="assets/audio/sfx/click.mp3" type="audio/mpeg">
</audio>

<audio id="unlockSound">
    <source src="assets/audio/sfx/unlock.mp3" type="audio/mpeg">
</audio>

<!-- ==========================
     JAVASCRIPT
========================== -->

<script src="js/utils.js"></script>

<script src="js/gameState.js"></script>

<script src="js/settings.js"></script>

<script src="js/player.js"></script>

<script src="js/leaderboard.js"></script>

<script src="js/achievements.js"></script>

<script src="js/audio.js"></script>

<script src="js/inventory.js"></script>

<script src="js/roomGenerator.js"></script>

<script src="js/puzzleManager.js"></script>

<script src="js/timer.js"></script>

<script src="js/saveManager.js"></script>

<script src="js/game.js"></script>

<script src="js/app.js"></script>

</body>
</html>
